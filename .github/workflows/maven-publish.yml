name: Build (Maven)

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 (OpenJDK / Temurin)
      # Temurin 是 OpenJDK 的发行版之一（Eclipse Adoptium）
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Build (with tests)
        run: mvn -B -ntp test

      # 如果你只想确认能编译更快：
      - name: Package (skip tests)
      run: mvn -B -ntp -DskipTests package
